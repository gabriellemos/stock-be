version: "3"

services:

  mongo-db:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234abcd56
      MONGODB_DATABASE: stock-controll

  mongo-express:
    image: mongo-express
    restart: always
    depends_on:
      - mongo-db
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: 1234abcd56
      ME_CONFIG_MONGODB_URL: mongodb://root:1234abcd56@mongo-db:27017
      # ME_CONFIG_BASICAUTH_USERNAME: admin <= default value
      # ME_CONFIG_BASICAUTH_PASSWORD: pass  <= default value

  e2e-mongo-db:
    image: mongo
    restart: always
    ports:
      - 27018:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234abcd56
      MONGODB_DATABASE: stock-controll
